# XcodeGen spec. Generate the project with `xcodegen generate`; never commit the .xcodeproj.
name: Gunce
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: tr

configFiles:
  Debug: App/Config/App.xcconfig
  Release: App/Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Gunce:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/**"
          - "Info.plist"
          - "Gunce.entitlements"
      - path: Shared
    dependencies:
      - target: PickUpWidgets
    settings:
      base:
        PRODUCT_NAME: Gunce
        # iPhone only. XcodeGen defaults iOS targets to "1,2", so this must sit on the target.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(GUNCE_BUNDLE_ID)
        # Set only by CI, which archives with manual signing and a short-lived profile.
        PROVISIONING_PROFILE_SPECIFIER: $(GUNCE_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - GunceUITests
    entitlements:
      path: App/Gunce.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # The app's own group stays first so the session token keeps its place;
        # `.shared` holds only the widget snapshot.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID)
          - $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID).shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PickUp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        GunceAPIHost: $(GUNCE_API_HOST)
        PickUpKeychainGroup: $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID).shared
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(GUNCE_BUNDLE_ID)
            CFBundleURLSchemes: [pickup]
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Tarihli görevlerini PickUp takvimine yazmak ve takvimindeki etkinlikleri Bugün ekranında göstermek için.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PickUpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "PickUpWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PickUpWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(GUNCE_BUNDLE_ID).widgets
        PROVISIONING_PROFILE_SPECIFIER: $(GUNCE_WIDGETS_PROFILE)
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/PickUpWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID).shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: PickUp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        PickUpKeychainGroup: $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The Mac app: menu bar panel plus a main window. Shares the store, API client and
  # models with the iPhone app; no Lock Screen or Live Activity code.
  PickUpMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    scheme: {}
    sources:
      - path: Mac
        excludes:
          - "Info.plist"
          - "PickUpMac.entitlements"
      - path: App/Core
        excludes:
          - "LockScreenSync.swift"
      - path: Shared/LockScreen.swift
      - path: Shared/StartTime.swift
    settings:
      base:
        PRODUCT_NAME: PickUp
        PRODUCT_BUNDLE_IDENTIFIER: $(GUNCE_BUNDLE_ID).mac
        # Set only by CI, which archives with manual signing and a short-lived profile.
        PROVISIONING_PROFILE_SPECIFIER: $(GUNCE_MAC_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Mac/PickUpMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.applesignin: [Default]
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(GUNCE_BUNDLE_ID).mac
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: PickUp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        GunceAPIHost: $(GUNCE_API_HOST)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCalendarsFullAccessUsageDescription: Tarihli görevlerini PickUp takvimine yazmak ve takvimindeki etkinlikleri göstermek için.

  GunceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Gunce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GUNCE_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
