name: Deploy Worker

# Every push to main that touches the backend applies D1 migrations and deploys the Worker.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      D1_NAME: gunce
      D1_LOCATION: eeur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Find or create the D1 database
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const db = JSON.parse(s).find(d => d.name === process.env.D1_NAME);
                if (db) process.stdout.write(db.uuid);
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler d1 create "$D1_NAME" --location "$D1_LOCATION"
            id="$(find_id)"
          fi
          test -n "$id" || { echo "::error::Could not resolve D1 database id"; exit 1; }
          # The id is not a secret, but it is kept out of the repo and injected here.
          node -e '
            const fs = require("fs");
            const f = "wrangler.jsonc";
            const out = fs.readFileSync(f, "utf8")
              .replace("00000000-0000-0000-0000-000000000000", process.argv[1]);
            fs.writeFileSync(f, out);' "$id"
          grep -q "$id" wrangler.jsonc

      - name: Apply migrations
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Deploy
        env:
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
        run: |
          if [ -z "$APPLE_BUNDLE_ID" ]; then
            echo "::warning::Repository variable APPLE_BUNDLE_ID is not set; Sign in with Apple will reject every token."
            APPLE_BUNDLE_ID="com.example.gunce"
          fi
          npx wrangler deploy --var "APPLE_BUNDLE_IDS:${APPLE_BUNDLE_ID},${APPLE_BUNDLE_ID}.mac"

      - name: Smoke test
        run: |
          sub="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result.subdomain))')"
          endpoint="https://gunce.${sub}.workers.dev"
          for i in 1 2 3 4 5; do
            if curl -fsS "$endpoint/health"; then echo; echo "Live at $endpoint"; exit 0; fi
            sleep 5
          done
          echo "::error::Health check failed at $endpoint"; exit 1
